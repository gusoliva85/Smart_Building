<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART Building — Inicio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body>

<div class="layout-app">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar shell" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" style="width:32px;height:32px;border-radius:10px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 21V6l8-3 8 3v15"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/>
        </svg>
      </span>
      <b style="font-size:14px;">SMART Building</b>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" style="width:32px;height:32px;border-radius:10px;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
        </div>
        <div>
          <div class="nombre" id="sidebar-user-nombre">—</div>
          <div class="rol" id="sidebar-user-rol">—</div>
        </div>
      </div>
      <button type="button" class="boton-primario" id="boton-logout" style="background:var(--glass-content-bg); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line); padding:9px;">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main-column">
    <header class="topbar shell" style="margin-bottom:14px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="icon-btn hamburger-btn" id="menu-btn" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <b style="font-size:14.5px;">Inicio</b>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Cambiar tema" id="theme-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="shell panel-centrado" style="padding:32px 28px; text-align:center;">
        <h1 style="margin:0 0 6px; font-size:20px;">Hola, <span id="bienvenida-nombre"></span></h1>
        <p style="margin:0; font-size:13.5px; color:var(--ink-3);">
          El Dashboard General y el Dashboard Visual del edificio (Documento Técnico, sección 1) todavía no están construidos —
          llegan en la Fase 5 y 6 del <a href="../documentacion/03_Roadmap.md" style="color:var(--accent-2); text-decoration:underline;">Roadmap</a>.
          Por ahora, usá el menú de la izquierda para acceder a lo que ya está funcionando.
        </p>
      </section>
    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const usuario = await window.Layout.montar('dashboard.html');
    if (!usuario) return;
    document.getElementById('bienvenida-nombre').textContent = usuario.nombre;
  });
</script>
</body>
</html>
