<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART Building — Iniciar sesión</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">

<!-- Tailwind vía CDN (Documento Técnico, sección 1.3.1) — se migra a Tailwind
     CLI standalone recién en la Fase 12, antes de cerrar la etapa de frontend. -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body>

<main class="app">

  <header class="topbar shell">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 21V6l8-3 8 3v15"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/>
        </svg>
      </span>
      <div class="brand-text">
        <b>SMART Building</b>
        <span>Plataforma de gestión de edificios</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" aria-label="Cambiar tema" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Zona pre-autenticación (Documento Técnico, sección 4.1): tarjeta
       centrada, sin sidebar — no hay nada que navegar sin sesión todavía. -->
  <section class="shell" id="vista-login" style="max-width:400px; margin:40px auto 0; padding:32px 28px;">
    <h1 style="margin:0 0 4px; font-size:22px;">Iniciar sesión</h1>
    <p style="margin:0 0 22px; font-size:13px; color:var(--ink-3);">Ingresá con el usuario que te dio tu administrador.</p>

    <div class="mensaje-error" id="mensaje-error" style="display:none;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="mensaje-error-texto"></span>
    </div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="campo-email">Email</label>
        <input type="email" id="campo-email" name="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="campo-password">Contraseña</label>
        <div class="campo-password-wrap">
          <input type="password" id="campo-password" name="password" autocomplete="current-password" required>
          <button type="button" class="campo-password-toggle" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="boton-primario" id="boton-ingresar">Ingresar</button>
    </form>
  </section>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/formularios.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
