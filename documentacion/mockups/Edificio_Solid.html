<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torre Central · Centro de alertas</title>
  <style>
    :root{--ink:#f1f5fb;--muted:#a4b1c5;--canvas:#101925;--line:#354961;--ok:#4ea982;--warning:#d3a53d;--critical:#c95b69}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#172536 0,#0d1622 52%,#152033 100%)}
    .app{width:min(1120px,calc(100% - 32px));margin:auto;padding:46px 0 70px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}.eyebrow{color:#aec7ff;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{margin:5px 0;font-size:clamp(31px,4vw,46px);letter-spacing:-2px}.subtitle{margin:0;color:var(--muted)}
    .metrics{display:flex;gap:9px}.metric{min-width:115px;padding:12px 15px;border:1px solid #41536a;border-radius:13px;background:#1d2b3d;box-shadow:0 12px 24px #0003}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}.legend{display:flex;align-items:center;gap:17px;flex-wrap:wrap;margin:0 0 16px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.legend .ok{background:var(--ok)}.legend .warning{background:var(--warning)}.legend .critical{background:var(--critical)}
    .scene{position:relative;padding:0 16px 42px;overflow:hidden}.skyline{position:absolute;inset:38% -15% 0;background:linear-gradient(90deg,transparent 0 3%,#0b1a2b 3% 7%,transparent 7% 11%,#0b1a2b 11% 18%,transparent 18% 21%,#0b1a2b 21% 30%,transparent 30% 35%,#0b1a2b 35% 44%,transparent 44% 49%,#0b1a2b 49% 61%,transparent 61% 67%,#0b1a2b 67% 76%,transparent 76% 81%,#0b1a2b 81% 90%,transparent 90%);opacity:.5;mask-image:linear-gradient(to bottom,transparent,black 15%);pointer-events:none}
    .building{position:relative;width:min(860px,100%);margin:auto;border:1px solid #526a85;border-bottom:0;border-radius:18px 18px 0 0;background:#1c2a3a;box-shadow:0 28px 70px #0009,inset 10px 0 #ffffff08,inset -10px 0 #0004}.roof{height:64px;position:relative;margin:-23px -15px 0;border:1px solid #69819d;border-bottom:0;border-radius:18px 18px 0 0;background:#2a4059;box-shadow:inset 0 1px #d9e8ff44}.roof:before{content:"TORRE CENTRAL";position:absolute;left:32px;bottom:15px;color:#d5e4ff;font-size:11px;font-weight:850;letter-spacing:2.5px}.roof:after{content:"●  SISTEMA ACTIVO";position:absolute;right:27px;bottom:15px;color:#8bd9b4;font-size:10px;font-weight:800;letter-spacing:1px}
    .floor{--state:var(--ok);--wash:#244936;position:relative;border-top:1px solid #455e79;background:#1b2a3b;transition:filter .25s,background .25s}.floor:before{content:"";position:absolute;inset:0;background:var(--wash);opacity:.54;pointer-events:none;transition:.25s}.floor:hover{filter:brightness(1.08)}.floor.open{z-index:1;background:#26394d}.floor.open:before{opacity:.68}
    .floor-head{position:relative;display:grid;grid-template-columns:112px 1fr 26px;gap:12px;align-items:center;width:100%;min-height:82px;padding:10px 23px;border:0;color:inherit;background:transparent;text-align:left;cursor:pointer}.floor-number{padding-right:13px;border-right:1px solid #526b85}.floor-number b{display:block;font-size:17px;letter-spacing:-.4px}.floor-number span{color:var(--state);font-size:10px;font-weight:850;letter-spacing:.7px;text-transform:uppercase}.windows{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.window{--window-color:var(--ok);position:relative;min-height:54px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--window-color) 62%,#71839a);border-radius:7px 7px 3px 3px;color:#f2f7ff;background:color-mix(in srgb,var(--window-color) 34%,#1a2b3d);box-shadow:inset 0 0 0 3px #ffffff0a,0 3px 7px #0003;font-size:13px;font-weight:800;letter-spacing:.3px;overflow:hidden}.window:after{content:"";position:absolute;inset:4px;border:1px solid #d7e5fa1d;border-radius:3px;pointer-events:none}.window.warning,.window.critical{color:#fff}.window-label{position:relative;z-index:1}.window-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--window-color);box-shadow:0 0 5px var(--window-color)}.chevron{color:var(--muted);font-size:21px;transition:transform .25s}.open .chevron{transform:rotate(180deg);color:#fff}
    .details{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s ease}.open .details{grid-template-rows:1fr}.details-inner{min-height:0;overflow:hidden}.apartments{position:relative;display:grid;grid-template-columns:112px repeat(4,1fr);gap:10px;padding:8px 23px 22px}.detail-caption{padding:12px 13px;color:var(--muted);font-size:11px;border-top:1px solid #526b85}.detail-caption b{display:block;color:#e4ebf5;font-size:12px;margin-bottom:3px}.apartment{--unit-color:var(--ok);min-height:118px;padding:12px;border:1px solid color-mix(in srgb,var(--unit-color) 60%,#64768b);border-radius:10px;background:color-mix(in srgb,var(--unit-color) 18%,#18283a);box-shadow:inset 0 1px #fff1}.apt-title{display:flex;justify-content:space-between;align-items:center;gap:5px}.apt-title b{font-size:15px}.state-tag{color:var(--unit-color);font-size:9px;font-weight:850;letter-spacing:.7px;text-transform:uppercase}.empty{margin:29px 0 0;color:#c0cad8;font-size:11px}.alert{margin-top:9px;padding:8px 8px 7px;border-radius:6px;border:1px solid color-mix(in srgb,var(--unit-color) 70%,#64768b);background:color-mix(in srgb,var(--unit-color) 34%,#162334);font-size:11px;font-weight:750}.alert time{display:block;margin-top:2px;color:#d2d9e3;font-size:10px;font-weight:500}
    .lobby{height:105px;display:grid;grid-template-columns:1fr 230px 1fr;gap:20px;align-items:end;padding:0 25px;background:linear-gradient(90deg,#111e31,#0b1523 50%,#111e31);border-top:2px solid #506b8d}.lobby-side{height:53px;border:1px solid #2f4868;background:repeating-linear-gradient(90deg,#0b192a 0 28px,#213754 28px 31px)}.entrance{height:91px;border:2px solid #6987ad;border-bottom:0;border-radius:7px 7px 0 0;background:linear-gradient(90deg,#0b1726 0 47%,#7894b233 47% 53%,#0b1726 53%);box-shadow:inset 0 0 20px #7ab5ff1c}.street{height:16px;margin:0 -35px;background:#0a1321;border-top:1px solid #3e526e;box-shadow:0 -10px 25px #0008}
    @media(max-width:700px){.app{width:min(100% - 20px,1120px);padding-top:25px}.topbar{display:block}.metrics{margin-top:17px}.scene{padding:0 2px 30px}.roof{margin:-15px -5px 0;height:54px}.roof:before{left:17px}.roof:after{right:15px;font-size:8px}.floor-head{grid-template-columns:65px 1fr 16px;gap:8px;padding:8px 10px;min-height:69px}.floor-number{padding-right:7px}.floor-number b{font-size:14px}.floor-number span{font-size:8px}.windows{gap:5px}.window{min-height:43px;font-size:11px}.apartments{grid-template-columns:repeat(2,1fr);padding:7px 10px 14px}.detail-caption{display:none}.lobby{grid-template-columns:1fr 130px 1fr;padding:0 10px;gap:8px}.lobby-side{height:43px}.entrance{height:73px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div><div class="eyebrow">Operaciones del edificio · tiempo real</div><h1>Torre Central</h1><p class="subtitle">Estado operacional de los departamentos y mantenimiento activo.</p></div><div class="metrics"><div class="metric"><b id="active-count">0</b><span>alertas activas</span></div><div class="metric"><b id="critical-count">0</b><span>alertas críticas</span></div></div></header>
    <div class="legend"><span><i class="ok"></i>Sin alertas</span><span><i class="warning"></i>Alerta regular</span><span><i class="critical"></i>Alerta crítica</span><span>· Tocá un piso para ver el detalle</span></div>
    <section class="scene" aria-label="Fachada interactiva de Torre Central"><div class="skyline"></div><div class="building"><div class="roof"></div><div id="floors"></div><div class="lobby"><div class="lobby-side"></div><div class="entrance"></div><div class="lobby-side"></div></div></div><div class="street"></div></section>
  </main>
  <script>
    // Fuente de datos: reemplazá este arreglo por la respuesta de tu API/base de datos.
    const buildingData=[
      {floor:7,units:{'7A':[],'7B':[],'7C':[],'7D':[]}},
      {floor:6,units:{'6A':[{title:'Pérdida de agua',type:'critical',time:'Reportada hace 8 min'}],'6B':[],'6C':[{title:'Panel de luz roto',type:'warning',time:'Reportada hace 32 min'}],'6D':[]}},
      {floor:5,units:{'5A':[],'5B':[],'5C':[{title:'Puerta rota',type:'warning',time:'Reportada hace 1 h'}],'5D':[]}},
      {floor:4,units:{'4A':[],'4B':[],'4C':[],'4D':[]}},
      {floor:3,units:{'3A':[{title:'Sin servicios',type:'critical',time:'Reportada hace 5 min'}],'3B':[],'3C':[],'3D':[{title:'Rotura del techo',type:'warning',time:'Reportada hace 2 h'}]}},
      {floor:2,units:{'2A':[],'2B':[{title:'Panel de luz roto',type:'warning',time:'Reportada hace 42 min'}],'2C':[],'2D':[]}},
      {floor:1,units:{'1A':[],'1B':[],'1C':[],'1D':[]}}
    ];
    const priority={ok:0,warning:1,critical:2};
    const stateOf=alerts=>alerts.some(a=>a.type==='critical')?'critical':alerts.some(a=>a.type==='warning')?'warning':'ok';
    const stateText=state=>({ok:'Sin alertas',warning:'Regular',critical:'Crítica'})[state];
    const alerts=buildingData.flatMap(f=>Object.values(f.units)).flat();
    document.querySelector('#active-count').textContent=alerts.length;
    document.querySelector('#critical-count').textContent=alerts.filter(a=>a.type==='critical').length;
    document.querySelector('#floors').innerHTML=buildingData.map(({floor,units})=>{
      const floorState=Object.values(units).map(stateOf).reduce((highest,current)=>priority[current]>priority[highest]?current:highest,'ok');
      const windows=Object.entries(units).map(([name,items])=>{const state=stateOf(items);return `<div class="window ${state}" style="--window-color:var(--${state})"><span class="window-label">${name}</span><i class="window-dot"></i></div>`}).join('');
      const cards=Object.entries(units).map(([name,items])=>{const state=stateOf(items);return `<article class="apartment" style="--unit-color:var(--${state})"><div class="apt-title"><b>${name}</b><span class="state-tag">${stateText(state)}</span></div>${items.length?items.map(a=>`<div class="alert"><strong>${a.title}</strong><time>${a.time}</time></div>`).join(''):'<p class="empty">Todo en orden</p>'}</article>`}).join('');
      const summary=floorState==='ok'?'Sin alertas':`Nivel ${stateText(floorState).toLowerCase()}`;
      return `<article class="floor" style="--state:var(--${floorState});--wash:color-mix(in srgb,var(--${floorState}) 34%,#1b2a3b)"><button class="floor-head" aria-expanded="false"><div class="floor-number"><b>Piso ${floor}</b><span>${summary}</span></div><div class="windows">${windows}</div><span class="chevron">⌄</span></button><div class="details"><div class="details-inner"><div class="apartments"><div class="detail-caption"><b>Detalle del piso</b>Alertas por departamento</div>${cards}</div></div></div></article>`;
    }).join('');
    document.querySelectorAll('.floor-head').forEach(button=>button.addEventListener('click',()=>{const container=button.closest('.floor');const isOpen=container.classList.toggle('open');button.setAttribute('aria-expanded',isOpen)}));
  </script>
</body>
</html>
