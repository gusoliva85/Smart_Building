[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --tb=short

# Ruido de terceros que no depende de este proyecto (starlette sobre anyio).
# Se silencia puntualmente para que un warning propio no pase inadvertido.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
